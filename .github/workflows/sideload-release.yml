name: Sideload release

# Every push to main builds the Host phone app and the Android TV app (sideload flavour),
# signs them with the sideload key and publishes them as the latest GitHub Release with an
# update.json. Installed apps read that file and offer "Update available" (see :updater).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "store-listing/**"
      - "samsung-tv/**"   # the Samsung app is installed by the Mac (tools/samsung-autoupdate.sh)
      - "tools/**"
      - "licenses/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sideload-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform 37.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        run: |
          # Above the hand-installed builds (host 2, tv 1); grows with every run.
          echo "GE_VERSION_CODE=$((100 + VERSION_CODE))" >> "$GITHUB_ENV"
          echo "GE_VERSION_NAME=1.2.$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Restore sideload key
        env:
          GE_SIDELOAD_KEYSTORE_BASE64: ${{ secrets.GE_SIDELOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GE_SIDELOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GE_SIDELOAD_KEYSTORE_BASE64 secret (see README › Automatic updates)"; exit 1
          fi
          echo "$GE_SIDELOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sideload.keystore"

      - name: Lint, test and build signed sideload APKs
        env:
          GE_SIDELOAD_STORE_FILE: ${{ runner.temp }}/sideload.keystore
          GE_SIDELOAD_STORE_PASSWORD: ${{ secrets.GE_SIDELOAD_STORE_PASSWORD }}
          GE_SIDELOAD_KEY_ALIAS: ${{ secrets.GE_SIDELOAD_KEY_ALIAS }}
          GE_SIDELOAD_KEY_PASSWORD: ${{ secrets.GE_SIDELOAD_KEY_PASSWORD }}
        run: >
          ./gradlew lint test :host:assembleSideloadRelease :tv:assembleSideloadRelease --console=plain
          -Pge.versionCode=$GE_VERSION_CODE -Pge.versionName=$GE_VERSION_NAME

      - name: Collect, verify and describe the APKs
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          tag="build-$VERSION_CODE"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"
          mkdir -p out
          cp host/build/outputs/apk/sideload/release/host-sideload-release.apk "out/GuestExperienceHost-$GE_VERSION_NAME.apk"
          cp tv/build/outputs/apk/sideload/release/tv-sideload-release.apk "out/GuestExperienceTV-$GE_VERSION_NAME.apk"
          for f in out/*.apk; do "$apksigner" verify "$f" || { echo "::error::$f is not signed"; exit 1; }; done
          entry() {
            local file="out/$1"
            printf '{"versionCode":%s,"versionName":"%s","apk":"%s/%s","sha256":"%s","size":%s}' \
              "$GE_VERSION_CODE" "$GE_VERSION_NAME" "$base" "$1" \
              "$(sha256sum "$file" | cut -d' ' -f1)" "$(stat -c%s "$file")"
          }
          printf '{"schema":1,"commit":"%s","host":%s,"tv":%s}\n' "$GITHUB_SHA" \
            "$(entry "GuestExperienceHost-$GE_VERSION_NAME.apk")" \
            "$(entry "GuestExperienceTV-$GE_VERSION_NAME.apk")" > out/update.json
          cat out/update.json
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/*.apk out/update.json \
            --target "$GITHUB_SHA" --latest \
            --title "Build $VERSION_CODE (version $GE_VERSION_NAME)" \
            --notes "Automatic build of $(git log -1 --format='%h %s'). Installed apps offer this update by themselves."
