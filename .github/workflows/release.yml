name: Release bundles

# Push a tag like v1.0.0 to build both signed Play AABs (play flavour, no self-updating).
# Upload them to Play Console by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform 37.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key
        env:
          GE_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GE_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GE_UPLOAD_KEYSTORE_BASE64" ]; then echo "Missing GE_UPLOAD_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$GE_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Lint, test and build signed bundles
        env:
          GE_UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          GE_UPLOAD_STORE_PASSWORD: ${{ secrets.GE_UPLOAD_STORE_PASSWORD }}
          GE_UPLOAD_KEY_ALIAS: ${{ secrets.GE_UPLOAD_KEY_ALIAS }}
          GE_UPLOAD_KEY_PASSWORD: ${{ secrets.GE_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew lint test bundlePlayRelease --console=plain

      - name: Check bundles are signed
        run: |
          for f in tv/build/outputs/bundle/playRelease/tv-play-release.aab host/build/outputs/bundle/playRelease/host-play-release.aab; do
            jarsigner -verify "$f" | grep -q "jar verified" || { echo "$f is not signed"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: aab-${{ github.ref_name }}
          path: |
            tv/build/outputs/bundle/playRelease/tv-play-release.aab
            host/build/outputs/bundle/playRelease/host-play-release.aab
            tv/build/outputs/mapping/playRelease/mapping.txt
          retention-days: 30
