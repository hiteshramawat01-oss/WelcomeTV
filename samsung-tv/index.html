<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Guest Welcome</title>
<link rel="stylesheet" href="style.css">
<!-- Samsung TV web APIs (screensaver control). Ignored in a desktop browser. -->
<script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>

<main id="welcome" class="screen" aria-live="polite">
  <p class="eyebrow">Welcome</p>
  <h1 id="guest-name" class="name"></h1>
  <div class="rule" aria-hidden="true"></div>
  <p id="guest-message" class="message"></p>
</main>

<section id="settings" class="screen settings" hidden>
  <h2>Welcome screen</h2>
  <p class="hint">Use the arrows to move, OK to type or press a button.</p>
  <label for="input-name">Guest name</label>
  <input id="input-name" type="text" maxlength="40" autocomplete="off">
  <label for="input-message">Welcome message</label>
  <input id="input-message" type="text" maxlength="200" autocomplete="off">
  <div class="buttons">
    <button id="btn-save" type="button">Save</button>
    <button id="btn-cancel" type="button">Cancel</button>
    <button id="btn-pair" type="button">Pair a phone</button>
  </div>
  <p class="hint small">Later, press OK on the remote 5 times quickly (or hold it for 3 seconds) to come back here.</p>
</section>

<section id="pairing" class="screen pairing" hidden>
  <h2>Pair a phone</h2>
  <p class="hint">In the Guest Experience Host app, choose this TV and enter this code.</p>
  <p id="pair-code" class="code" aria-live="polite"></p>
  <p id="pair-status" class="hint" aria-live="polite"></p>
  <p id="paired-phones" class="hint small"></p>
  <p id="link-status" class="hint small"></p>
  <div class="buttons">
    <button id="btn-pair-done" type="button">Done</button>
    <button id="btn-forget" type="button">Remove all phones</button>
  </div>
</section>

<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
